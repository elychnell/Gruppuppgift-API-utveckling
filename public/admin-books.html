<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Admin Books</title>
  </head>
  <body>
    <!-- Admin book list-->
    <h1 class="title">Admin Panel</h1>
    <div id="adminBookList"></div>

    <!--Edit book form-->
    <section id="edit-book-section" style="display: none">
      <h2>Edit book</h2>

      <form id="edit-book-form">
        <input type="hidden" id="edit-book-id" />

        <div>
          <label for="edit-title">Title</label>
          <input type="text" id="edit-title" required />
        </div>

        <div>
          <label for="edit-author">Author</label>
          <input type="text" id="edit-author" required />
        </div>

        <div>
          <label for="edit-description">Description</label>
          <textarea id="edit-description" required></textarea>
        </div>

        <div>
          <label for="edit-genres">Genres</label>
          <input
            type="text"
            id="edit-genres"
            placeholder="Fantasy, Adventure"
            required
          />
        </div>

        <div>
          <label for="edit-published-year">Published Year</label>
          <input
            type="number"
            id="edit-published-year"
            min="1900"
            max="2028"
            required
          />
        </div>

        <button type="submit">Save changes</button>
        <button type="button" id="cancel-edit">Cancel</button>
      </form>
    </section>

    <section>
      <h2>Books</h2>
      <div id="adminBookList"></div>
    </section>

    <!--Form to post a new book-->

    <h1 class="title">Add New Book</h1>

    <form id="createBookForm">
      <label for="image">Image URL</label>
      <input class="formControl" type="text" id="image" name="image" required />

      <label for="thumbnail" class="form-label">Thumbnail URL</label>
      <input
        type="text"
        class="formControl"
        id="thumbnail"
        name="thumbnail"
        required
      />

      <label for="title" class="form-label">Title</label>
      <input type="text" class="formControl" id="title" name="title" required />

      <label for="description" class="form-label">Description</label>
      <textarea
        class="formControl"
        id="description"
        name="description"
        required
      ></textarea>

      <label for="author" class="form-label">Author</label>
      <input
        type="text"
        class="formControl"
        id="author"
        name="author"
        required
      />

      <label for="genres" class="form-label">Genres</label>
      <input
        type="text"
        class="formControl"
        id="genres"
        name="genres"
        required
      />

      <label for="published_year" class="form-label">Published Year</label>
      <input
        type="number"
        min="0"
        class="formControl"
        id="published_year"
        name="published_year"
        required
      />

      <button type="submit" class="btn, btn-primary:hover">Add Book</button>
    </form>
    <script src="js/admin-books.js"></script>
    <script src="js/create-book.js"></script>

    <script src="js/delete-book.js"></script>
  </body>
</html>
