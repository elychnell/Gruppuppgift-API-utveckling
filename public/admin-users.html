<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">
  <div class="container py-5">
    <div class="d-flex justify-content-end mb-3">
      <a href="index.html" id="back-btn" class="btn btn-outline-secondary">Back</a>
    </div>
    <div class="card shadow-sm">
      <div class="card-header bg-white py-3">
        <h1 class="h4 mb-0">Users</h1>
      </div>

      <div class="card-body p-0">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th class="ps-4">Username</th>
              <th>Role</th>
              <th class="pe-4">Created</th>
            </tr>
          </thead>
          <tbody id="users-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="modal fade" id="editUserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="edit-user-id">
          <div class="mb-3">
            <label for="edit-username" class="form-label">Username</label>
            <input type="text" class="form-control" id="edit-username">
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="edit-is-admin">
            <label class="form-check-label" for="edit-is-admin">
              Admin
            </label>
          </div>
          <p id="edit-error" class="text-danger small mb-0"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="save-user-btn">Save</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="js/users.js"></script>
</body>

</html>
