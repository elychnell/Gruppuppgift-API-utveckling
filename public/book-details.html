<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Details</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bdContainer">
    <div id="detailsBox" class="detailsBox">
    <div id="bookImg" class="bookImg"></div>
   <div id="bookDetails" class="bookDetails"></div>
    </div>
   <div id="reviews" class="reviews">

   </div>
   <div id="addReview" class="addReview">
<form id="reviewForm" class="reviewForm">
  <h3>Add a Review</h3>
<div class="form-group rating-group">
<label for="rating">Your Rating:</label>

  <div class="rating">
    <input id="star5" type="radio" name="rating" value="5">
<label for="star5">★</label>

<input id="star4" type="radio" name="rating" value="4">
<label for="star4">★</label>

<input id="star3" type="radio" name="rating" value="3">
<label for="star3">★</label>

<input id="star2" type="radio" name="rating" value="2">
<label for="star2">★</label>

<input id="star1" type="radio" name="rating" value="1">
<label for="star1">★</label>
  </div>
</div>
<textarea
    id="reviewText"
    name="reviewText"
    placeholder="Your Review"
    required
  ></textarea>

  <input
    type="text"
    id="reviewerName"
    name="reviewerName"
    placeholder="Your Name"
    required
  >
  <button type="submit">Submit Review</button>
  </div>
  </div>
  <script src="js/book-details.js"></script>
</body>
</html>
