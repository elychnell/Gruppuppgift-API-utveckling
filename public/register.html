<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body class="register-page">
  <div class="register-card">
    <h1 class="title">Register</h1>
    <div class="mb-3">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Choose a username">
    </div>
    <div class="mb-3">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Choose a password">
    </div>
    <p id="register-message"></p>
    <button id="register-btn" class="btn btn-primary w-100">Register</button>
    <p class="register-footer">
      <a href="login.html">Already have an account? Login here</a>
    </p>
  </div>
  <script src="js/register.js"></script>
</body>

</html>
